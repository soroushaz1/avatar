name: Diagnose

# Read-only: service status, recent app errors and how the large browser assets were delivered.
# The repository is public, so client IP addresses are stripped from the output.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 \
            "$(echo "$SSH_USER" | tr -d '[:space:]')@$(echo "$SSH_HOST" | tr -d '[:space:]')" 'bash -s' <<'EOF'
          echo "== services"; systemctl is-active avatar-web avatar-tts
          echo "== memory"; free -m | sed -n 1,3p
          echo "== app log (last 30 lines)"; journalctl -u avatar-web -n 30 --no-pager -o cat
          echo "== tts log (last 10 lines)"; journalctl -u avatar-tts -n 10 --no-pager -o cat
          echo "== large asset requests (status, bytes sent; expected: wasm ~4MB gzipped / 14.5MB, model 3758596)"
          for f in /var/log/nginx/access.log /var/log/nginx/access.log.1; do
            [ -f "$f" ] && grep -E 'vision_wasm|face_landmarker|vision_bundle' "$f" | tail -n 30 \
              | awk '{ split($0, q, "\""); print $4, $5, q[2], $9, $10 }'
          done
          echo "== gzip check"
          curl -s -o /dev/null -w 'wasm via nginx: HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n' \
            -H 'Accept-Encoding: gzip' --resolve avatar.tamirdesk.ir:443:127.0.0.1 \
            https://avatar.tamirdesk.ir/vendor/mediapipe/wasm/vision_wasm_internal.wasm
          EOF
