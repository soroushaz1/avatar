name: Server check

# Read-only connectivity check: verifies the deploy secrets and prints basic server facts.
# The repository is public, so the log only shows non-sensitive facts.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.IR_SSH_HOST }}
      SSH_USER: ${{ secrets.IR_SSH_USER }}
      SSH_PORT: ${{ secrets.IR_SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      ZARINPAL_MERCHANT_ID: ${{ secrets.ZARINPAL_MERCHANT_ID }}
    steps:
      - name: Check secrets
        run: |
          ok=1
          for v in SSH_HOST SSH_USER SSH_KEY ZARINPAL_MERCHANT_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is missing"; ok=0; else echo "$v: set"; fi
          done
          if ! printf '%s' "$ZARINPAL_MERCHANT_ID" | tr -d '[:space:]' | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::warning::ZARINPAL_MERCHANT_ID does not look like a 36-character merchant id"
          fi
          if ! printf '%s\n' "$SSH_KEY" | tr -d '\r' | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "::error::SSH_KEY has no '-----BEGIN ... PRIVATE KEY-----' line (was the .pub file pasted?)"; ok=0
          fi
          [ "$ok" = 1 ]

      - name: Connect to server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::SSH_KEY is not a valid private key"; exit 1; }
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 -p "$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')" \
            "$(echo "$SSH_USER" | tr -d '[:space:]')@$(echo "$SSH_HOST" | tr -d '[:space:]')" 'bash -s' <<'EOF'
          echo "Connected as $(whoami)"
          . /etc/os-release && echo "OS: $PRETTY_NAME"
          echo "CPU cores: $(nproc)"
          free -h | sed -n 2p
          df -h / | tail -1
          for c in node npm python3 git caddy nginx apache2 docker; do
            if command -v "$c" >/dev/null 2>&1; then echo "$c: $(command -v "$c")"; else echo "$c: not installed"; fi
          done
          command -v node >/dev/null && echo "node version: $(node --version)"
          EOF
