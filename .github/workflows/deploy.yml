name: Deploy

# Ships the app to the server over SSH and runs deploy/install.sh there.
# Secrets: SSH_HOST, SSH_USER, SSH_KEY, ZARINPAL_MERCHANT_ID, GEMINI_API_KEY.
# Optional repository variables: DOMAIN, ZARINPAL_SANDBOX, GEMINI_IMAGE_MODEL, PLAN_MONTHLY_TOMAN,
# PLAN_QUARTERLY_TOMAN, AVATAR_DAILY_LIMIT, AVATAR_FREE_LIMIT, AVATAR_SUBSCRIBER_LIMIT.
# Manual for now (Actions > Deploy > Run workflow); can be switched to run on every push to main later.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Package release
        run: tar czf "$RUNNER_TEMP/release.tgz" --exclude=./.git --exclude=./node_modules --exclude=./data --exclude=./.env --exclude=./.github .

      - name: Prepare SSH and deploy settings
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DOMAIN: ${{ vars.DOMAIN || 'avatar.pythonpath.ir' }}
          ZARINPAL_MERCHANT_ID: ${{ secrets.ZARINPAL_MERCHANT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZARINPAL_SANDBOX: ${{ vars.ZARINPAL_SANDBOX }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          PLAN_MONTHLY_TOMAN: ${{ vars.PLAN_MONTHLY_TOMAN }}
          PLAN_QUARTERLY_TOMAN: ${{ vars.PLAN_QUARTERLY_TOMAN }}
          AVATAR_DAILY_LIMIT: ${{ vars.AVATAR_DAILY_LIMIT }}
          AVATAR_FREE_LIMIT: ${{ vars.AVATAR_FREE_LIMIT }}
          AVATAR_SUBSCRIBER_LIMIT: ${{ vars.AVATAR_SUBSCRIBER_LIMIT }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          # Settings file copied to the server (never printed); values are shell-quoted.
          for v in DOMAIN ZARINPAL_MERCHANT_ID GEMINI_API_KEY ZARINPAL_SANDBOX GEMINI_IMAGE_MODEL PLAN_MONTHLY_TOMAN \
                   PLAN_QUARTERLY_TOMAN AVATAR_DAILY_LIMIT AVATAR_FREE_LIMIT AVATAR_SUBSCRIBER_LIMIT; do
            val=$(printf '%s' "${!v}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -n "$val" ] && printf "%s=%q\n" "$v" "$val"
          done > "$RUNNER_TEMP/deploy.env"
          true

      - name: Upload and install
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          host=$(echo "$SSH_HOST" | tr -d '[:space:]')
          user=$(echo "$SSH_USER" | tr -d '[:space:]')
          opts=(-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30)
          scp -q "${opts[@]}" "$RUNNER_TEMP/release.tgz" "$user@$host:/tmp/avatar-release.tgz"
          scp -q -p "${opts[@]}" "$RUNNER_TEMP/deploy.env" "$user@$host:/tmp/avatar-deploy.env"
          sudo_cmd=""; [ "$user" = root ] || sudo_cmd="sudo -n"
          ssh "${opts[@]}" "$user@$host" \
            "chmod 600 /tmp/avatar-deploy.env; $sudo_cmd env RELEASE=/tmp/avatar-release.tgz ENV_FILE=/tmp/avatar-deploy.env bash -s; status=\$?; rm -f /tmp/avatar-deploy.env /tmp/avatar-release.tgz; exit \$status" \
            < deploy/install.sh
