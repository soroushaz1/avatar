name: Iran server check

# Read-only: checks SSH access to the Iranian server and what it can reach from inside Iran (Google
# Gemini usually refuses Iranian servers; package registries and Hugging Face may be filtered).
# Changes nothing on the server and prints only non-sensitive facts.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.IR_SSH_HOST }}
      SSH_USER: ${{ secrets.IR_SSH_USER }}
      SSH_PORT: ${{ secrets.IR_SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check secrets
        run: |
          ok=1
          for v in SSH_HOST SSH_USER SSH_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is missing"; ok=0; else echo "$v: set"; fi
          done
          echo "SSH port: ${SSH_PORT:-22 (default)}"
          [ "$ok" = 1 ]

      - name: Deploy key to authorize on the server
        run: |
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          # The public half of SSH_KEY (safe to show): this exact line belongs in ~/.ssh/authorized_keys
          # of SSH_USER on the server, on a single line.
          echo "Public key:"
          ssh-keygen -y -f ~/.ssh/id_deploy | sed 's/$/ github-deploy/'
          echo "Fingerprint: $(ssh-keygen -y -f ~/.ssh/id_deploy | ssh-keygen -lf - | awk '{ print $2 }')"

      - name: Server facts and what it can reach
        run: |
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          host=$(echo "$SSH_HOST" | tr -d '[:space:]'); user=$(echo "$SSH_USER" | tr -d '[:space:]')
          port=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          # The Gemini key goes over stdin (first line), so it never shows in a command line.
          { printf '%s\n' "$(printf %s "$GEMINI_API_KEY" | tr -d '[:space:]')"; cat <<'EOF'
          echo "Connected as $(whoami) on $(hostname)"
          . /etc/os-release && echo "OS: $PRETTY_NAME"
          echo "CPU cores: $(nproc)"
          free -h | sed -n 1,3p
          df -h / | tail -1
          for c in node npm python3 nginx certbot ffmpeg git curl docker; do
            if command -v "$c" >/dev/null 2>&1; then echo "$c: $("$c" --version 2>&1 | head -1)"; else echo "$c: not installed"; fi
          done
          echo "== listening TCP ports"
          ss -ltn 2>/dev/null | awk 'NR > 1 { print $4 }' | sort -u | head -20
          echo "== what this server can reach (HTTP status, seconds)"
          check() { printf '%-28s %s\n' "$1" "$(curl -s -o /dev/null -m 20 -w '%{http_code} %{time_total}s' "$2" 2>/dev/null || echo 'no connection')"; }
          check "Google Gemini API" https://generativelanguage.googleapis.com/v1beta/models
          check "npm registry" https://registry.npmjs.org/express
          check "PyPI" https://pypi.org/simple/piper-tts/
          check "Hugging Face (voices)" https://huggingface.co/rhasspy/piper-voices/resolve/main/voices.json
          printf '%-28s %s\n' "Voice file (after redirect)" "$(curl -sL -r 0-1023 -o /dev/null -m 30 -w '%{http_code} %{time_total}s' \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/fa/fa_IR/amir/medium/fa_IR-amir-medium.onnx 2>/dev/null || echo 'no connection')"
          check "Node.js downloads" https://nodejs.org/dist/index.json
          check "NodeSource packages" https://deb.nodesource.com/
          check "GitHub" https://github.com
          check "Let's Encrypt" https://acme-v02.api.letsencrypt.org/directory
          check "ZarinPal" https://payment.zarinpal.com/pg/v4/payment/request.json
          check "Ubuntu packages" http://archive.ubuntu.com/ubuntu/
          check "Current server (abroad)" https://avatar.tamirdesk.ir/
          echo "== Gemini with the API key (status and Google's message only)"
          if [ -n "$GEMINI_API_KEY" ]; then
            code=$(curl -s -m 20 -o /tmp/gemini.json -w '%{http_code}' -H "x-goog-api-key: $GEMINI_API_KEY" \
              "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1" 2>/dev/null || echo 'no connection')
            echo "HTTP $code: $(python3 -c 'import json; print(json.load(open("/tmp/gemini.json")).get("error", {}).get("message", "OK"))' 2>/dev/null | head -c 200)"
            rm -f /tmp/gemini.json
            # Google applies its country restrictions when generating, so try a tiny real request too.
            code=$(curl -s -m 30 -o /tmp/gemini.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -H "x-goog-api-key: $GEMINI_API_KEY" -d '{"contents":[{"parts":[{"text":"Reply with the single word OK."}]}]}' \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent" 2>/dev/null || echo 'no connection')
            echo "Generate: HTTP $code: $(python3 -c 'import json; j = json.load(open("/tmp/gemini.json")); print(j.get("error", {}).get("message") or j["candidates"][0]["content"]["parts"][0]["text"].strip())' 2>/dev/null | head -c 200)"
            rm -f /tmp/gemini.json
          fi
          EOF
          } | ssh -i ~/.ssh/id_deploy -p "$port" -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 \
              "$user@$host" 'read -r K; GEMINI_API_KEY="$K" bash -s'
